services:
  arkclaw-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: arkclaw-demo:latest
    container_name: arkclaw-demo
    restart: unless-stopped
    user: root
    ports:
      - "18810:18789"
      - "18811:18790"
    volumes:
      - ./runtime:/root/.openclaw
    env_file:
      - openclaw.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
