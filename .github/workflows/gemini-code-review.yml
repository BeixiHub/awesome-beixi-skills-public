name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.py' '*.json' '*.md' '*.yml' '*.yaml' | head -c 50000)
          echo "diff<<DIFF_EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT

      - name: Gemini Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const diff = `${{ steps.diff.outputs.diff }}`;
            if (!diff || diff.trim().length === 0) {
              console.log('No relevant diff found, skipping review.');
              return;
            }

            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              core.warning('GEMINI_API_KEY not set. Skipping Gemini review.');
              return;
            }

            const prompt = `You are a senior code reviewer. Review the following pull request diff and provide:
            1. A brief summary of the changes
            2. Potential issues (bugs, security, performance)
            3. Suggestions for improvement
            4. Overall assessment (Approve / Request Changes / Comment)

            Be concise and actionable. Focus on significant issues, not style nitpicks.
            Respond in Chinese (中文).

            PR Title: ${context.payload.pull_request.title}
            PR Description: ${context.payload.pull_request.body || 'No description'}

            Diff:
            \`\`\`diff
            ${diff.substring(0, 30000)}
            \`\`\``;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: { temperature: 0.3, maxOutputTokens: 4096 },
                }),
              }
            );

            if (!response.ok) {
              const err = await response.text();
              core.warning(`Gemini API error: ${response.status} ${err}`);
              return;
            }

            const data = await response.json();
            const review = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!review) {
              core.warning('Gemini returned empty review.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 Gemini Code Review\n\n${review}\n\n---\n*Powered by Gemini 2.0 Flash*`,
            });
