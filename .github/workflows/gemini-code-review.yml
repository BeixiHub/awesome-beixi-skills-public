name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD -- '*.py' '*.json' '*.md' '*.yml' '*.yaml' > /tmp/pr_diff_full.txt
          head -c 500000 /tmp/pr_diff_full.txt > /tmp/pr_diff.txt
          FULL_SIZE=$(wc -c < /tmp/pr_diff_full.txt)
          TRUNC_SIZE=$(wc -c < /tmp/pr_diff.txt)
          echo "FULL_DIFF_SIZE=$FULL_SIZE" >> $GITHUB_ENV
          echo "TRUNCATED=$([ "$FULL_SIZE" -gt "$TRUNC_SIZE" ] && echo true || echo false)" >> $GITHUB_ENV
          echo "DIFF_SIZE=$(wc -c < /tmp/pr_diff.txt)" >> $GITHUB_ENV

      - name: Gemini Code Review
        if: env.DIFF_SIZE != '0'
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              core.warning('GEMINI_API_KEY not set. Skipping Gemini review.');
              return;
            }

            const diff = fs.readFileSync('/tmp/pr_diff.txt', 'utf8');
            if (!diff.trim()) {
              console.log('Empty diff, skipping.');
              return;
            }

            const prTitle = process.env.PR_TITLE || '';
            const prBody = process.env.PR_BODY || 'No description';

            const prompt = [
              'You are a senior code reviewer. Review the following pull request diff and provide:',
              '1. A brief summary of the changes',
              '2. Potential issues (bugs, security, performance)',
              '3. Suggestions for improvement',
              '4. Overall assessment (Approve / Request Changes / Comment)',
              '',
              'Be concise and actionable. Focus on significant issues, not style nitpicks.',
              'Respond in Chinese.',
              '',
              'PR Title: ' + prTitle,
              'PR Description: ' + prBody,
              '',
              'Diff:',
              '```diff',
              diff,
              '```',
            ].join('\n');

            const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey;
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.3, maxOutputTokens: 4096 },
              }),
            });

            if (!response.ok) {
              const err = await response.text();
              core.warning('Gemini API error: ' + response.status + ' ' + err);
              return;
            }

            const data = await response.json();
            const review = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;

            if (!review) {
              core.warning('Gemini returned empty review.');
              return;
            }

            const truncNote = process.env.TRUNCATED === 'true'
              ? '\n\n> ⚠️ Diff was truncated to 500KB (full size: ' + process.env.FULL_DIFF_SIZE + ' bytes). Some changes may not have been reviewed.\n'
              : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '## 🤖 Gemini Code Review\n\n' + review + truncNote + '\n\n---\n*Powered by Gemini 2.5 Flash*',
            });
